<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабораторная работа 2 - попадание точки</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #2c2c2c;
      background-color: #ece8df;
      margin: 0;
    }

    table {
      border-collapse: collapse;
    }

    #main-table {
      width: 100%;
    }

    #main-table > tbody > tr > td {
      vertical-align: top;
      padding: 1.5%;
    }

    header {
      font-family: serif;
      color: #006400;
      font-size: 22px;
      text-align: center;
    }

    #header {
      color: #f4f1ea;
      background-color: #2f3e2e;
      padding: 2%;
    }

    #plot {
      border: 1px solid #2c2c2c;
      background-color: #ffffff;
    }

    #point-form > p {
      margin-top: 2%;
      margin-bottom: 2%;
    }

    .x-values label {
      display: inline-block;
      margin-right: 5px;
      white-space: nowrap;
    }

    input, select {
      padding: 1% 2%;
    }

    button {
      padding: 1% 3%;
    }

    #results {
      width: 100%;
    }

    #results th,
    #results td {
      border: 1px solid #2c2c2c;
      padding: 1%;
      text-align: center;
    }

    #results th {
      background-color: #2f3e2e;
      color: #f4f1ea;
    }

    #clear-results {
      margin-bottom: 1%;
    }

    #form-error {
      color: #8b1e1e;
      min-height: 1em;
    }
</style>
</head>
<body>
  <table id="main-table">
    <tr>
      <td colspan="2">
        <header id="header">
          Мелихов Артём Александрович, P3230, вариант 22718
        </header>
      </td>
    </tr>
    <tr>
      <td>
        <canvas id="plot" width="400" height="400"></canvas>
      </td>
      <td>
        <form id="point-form">
          <p class="x-values">
            X:
            <label><input type="checkbox" name="x" value="-4"> -4</label>
            <label><input type="checkbox" name="x" value="-3"> -3</label>
            <label><input type="checkbox" name="x" value="-2"> -2</label>
            <label><input type="checkbox" name="x" value="-1"> -1</label>
            <label><input type="checkbox" name="x" value="0"> 0</label>
            <label><input type="checkbox" name="x" value="1"> 1</label>
            <label><input type="checkbox" name="x" value="2"> 2</label>
            <label><input type="checkbox" name="x" value="3"> 3</label>
            <label><input type="checkbox" name="x" value="4"> 4</label>
          </p>
          <p>
            <label for="y">Y:</label>
            <input id="y" name="y" type="text" placeholder="Y ∈ (-5..5)" maxlength="7">
          </p>
          <p>
            <label for="r">R:</label>
            <select id="r" name="r">
              <option value="1">1</option>
              <option value="1.5">1.5</option>
              <option value="2" selected>2</option>
              <option value="2.5">2.5</option>
              <option value="3">3</option>
            </select>
          </p>
          <p>
            <button id="submit-point" type="submit">Проверить</button>
          </p>
          <p id="form-error"></p>
        </form>
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <button id="clear-results" type="button">Очистить результаты</button>
        <table id="results">
          <thead>
            <tr>
              <th>X</th>
              <th>Y</th>
              <th>R</th>
              <th>Попадание</th>
              <th>Время</th>
              <th>Работа скрипта, мс</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </td>
    </tr>
  </table>
  <script src="script.js"></script>
</body>
</html>
